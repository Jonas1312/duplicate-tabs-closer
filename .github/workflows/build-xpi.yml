name: Build Firefox XPI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xpi:
    name: Build Firefox extension package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build XPI
        shell: bash
        run: bash scripts/build-firefox-xpi.sh

      - name: Upload XPI artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: duplicate-tabs-closer-firefox-xpi
          path: dist/duplicate-tabs-closer-firefox.xpi
          if-no-files-found: error
          retention-days: 30
